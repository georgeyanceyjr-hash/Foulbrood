[package]
name = "hive-hydra"
version = "0.1.0"
edition = "2021"
description = "hivegame.com bot client (from github.com/hiveboardgame/hive, with a clock-aware time budget patch)"

[dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.1", features = ["rustls", "json"], default-features = false }
thiserror = "2.0.18"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time", "env-filter"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.20"

[profile.release]
opt-level = 2

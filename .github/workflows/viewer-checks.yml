name: Viewer checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    name: Viewer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build release helpers
        run: cargo +stable build --locked --release
      - name: Test Rust (debug)
        run: cargo +stable test --locked
      - name: Test Rust (release)
        run: cargo +stable test --locked --release
      - name: Test viewer and board controls
        run: python tools/check_viewer.py
